<!doctype html><html lang="ja"><meta charset="utf-8"><title>AIBOU 電流プレビュー</title><style>body{margin:0;background:#edf0f5;color:#243348;font:16px system-ui}header{padding:16px;display:flex;gap:16px;align-items:center}canvas{width:100%;display:block}button{padding:8px 18px}input{flex:1}</style><header><button id="play">一時停止</button><span>電流 · 24fps / 4秒ループ</span><input id="seek" type="range" min="0" max="95" value="0"><span id="status">読み込み中</span></header><canvas width="1672" height="941"></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),seek=document.querySelector('#seek'),button=document.querySelector('#play');let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,frame=0,last=performance.now(),acc=0;const imgs=[];function load(src){return new Promise((resolve,reject)=>{let i=new Image;i.onload=()=>resolve(i);i.onerror=reject;i.src=src;});}function draw(){ctx.drawImage(imgs[frame],0,0,1672,941);seek.value=frame;status.textContent=(frame+1)+'/96';}button.onclick=()=>{playing=!playing;button.textContent=playing?'一時停止':'再生';};seek.oninput=()=>{playing=false;button.textContent='再生';frame=+seek.value;draw();};(async()=>{for(let i=0;i<96;i++){imgs.push(await load('Frames/frame-'+String(i).padStart(3,'0')+'.png'));status.textContent='読み込み '+(i+1)+'/96';}button.textContent=playing?'一時停止':'再生';draw();last=performance.now();function tick(t){if(playing){acc+=Math.min(t-last,100);if(acc>=1000/24){const steps=Math.floor(acc/(1000/24));acc%=1000/24;frame=(frame+steps)%96;draw();}}last=t;requestAnimationFrame(tick);}requestAnimationFrame(tick);})().catch(()=>status.textContent='PNGを読み込めませんでした');</script></html>
